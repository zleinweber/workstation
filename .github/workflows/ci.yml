name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, '1.85.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Build
        run: cargo +${{ matrix.toolchain }} build --locked
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets
      - name: Smoke check CLI
        shell: bash
        run: |
          ./target/debug/wstn --help
          ./target/debug/wstn --version
          if ./target/debug/wstn setup; then
            echo 'Unimplemented setup must not report success'
            exit 1
          else
            test "$?" -eq 2
          fi
