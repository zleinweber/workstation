[package]
name = "workstation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A recipe-driven dotfiles manager with basic configuration management"
license = "MIT"
publish = false

[dependencies]
clap = { version = "~4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "wstn"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
